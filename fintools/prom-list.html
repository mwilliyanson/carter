<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promotion Data Exporter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: linear-gradient(
        135deg,
        #f8fafc,
        #eef2ff
    );

    color: #172033;
}

.container {
    width: min(1500px, calc(100% - 40px));
    margin: auto;
    padding: 40px 0 60px;
}

.header {
    margin-bottom: 28px;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 6px 11px;

    background: #eef2ff;
    color: #4f46e5;

    border: 1px solid #e0e7ff;
    border-radius: 999px;

    font-size: 12px;
    font-weight: 700;

    text-transform: uppercase;
}

.badge-dot {
    width: 7px;
    height: 7px;

    background: #6366f1;
    border-radius: 50%;
}

h1 {
    margin: 14px 0 0;

    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: -0.03em;
}

.subtitle {
    margin-top: 12px;

    max-width: 700px;

    color: #64748b;

    line-height: 1.6;
}

.card {
    background: rgba(255,255,255,.95);

    border: 1px solid #e5e7eb;

    border-radius: 18px;

    box-shadow:
        0 15px 45px rgba(15,23,42,.08);

    overflow: hidden;
}

.form-card {
    padding: 24px;
}

.form-grid {
    display: grid;

    grid-template-columns:
        1.3fr
        1fr
        1fr
        .8fr
        auto;

    gap: 16px;

    align-items: end;
}

.field {
    min-width: 0;
}

label {
    display: block;

    margin-bottom: 8px;

    color: #334155;

    font-size: 13px;
    font-weight: 700;
}

input {
    width: 100%;
    height: 46px;

    padding: 0 13px;

    border: 1px solid #dbe1ea;

    border-radius: 10px;

    background: white;

    font-size: 14px;

    outline: none;
}

input:focus {
    border-color: #6366f1;

    box-shadow:
        0 0 0 4px
        rgba(99,102,241,.1);
}

.fetch-btn {
    height: 46px;

    padding: 0 22px;

    border: 0;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #6366f1
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;
}

.fetch-btn:disabled {
    opacity: .65;
    cursor: not-allowed;
}

.status {
    margin-top: 16px;

    padding: 11px 14px;

    border-radius: 9px;

    font-size: 13px;

    display: none;
}

.status.info,
.status.success,
.status.error {
    display: block;
}

.status.info {
    background: #eff6ff;
    color: #1d4ed8;
}

.status.success {
    background: #f0fdf4;
    color: #15803d;
}

.status.error {
    background: #fef2f2;
    color: #b91c1c;
}

#results {
    display: none;
    margin-top: 24px;
}

.results-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    padding: 22px 24px;

    border-bottom: 1px solid #e5e7eb;
}

.results-title {
    margin: 0;

    font-size: 18px;
}

.results-description {
    margin: 5px 0 0;

    color: #64748b;

    font-size: 13px;
}

.download-btn {
    height: 42px;

    padding: 0 17px;

    border: 1px solid #dbe1ea;

    border-radius: 9px;

    background: white;

    font-weight: 700;

    cursor: pointer;
}

.download-btn:hover {
    background: #f8fafc;
}

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    padding: 18px 24px;

    background: #f8fafc;

    border-bottom: 1px solid #e5e7eb;
}

.stat {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 11px;

    padding: 14px 16px;
}

.stat-label {
    color: #64748b;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;
}

.stat-value {
    margin-top: 5px;

    font-size: 18px;

    font-weight: 750;
}

.table-wrapper {
    width: 100%;

    overflow-x: auto;
    overflow-y: auto;

    max-height: 650px;
}

table {
    width: max-content;

    min-width: 100%;

    border-collapse: collapse;

    font-size: 12px;
}

thead {
    position: sticky;

    top: 0;

    z-index: 5;
}

th {
    padding: 12px 14px;

    background: #f8fafc;

    color: #475569;

    border-bottom: 1px solid #dbe1ea;
    border-right: 1px solid #eef2f7;

    text-align: left;

    white-space: nowrap;

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;
}

td {
    padding: 11px 14px;

    color: #334155;

    border-bottom: 1px solid #f1f5f9;
    border-right: 1px solid #f8fafc;

    white-space: nowrap;

    max-width: 400px;

    overflow: hidden;

    text-overflow: ellipsis;
}

tbody tr:hover {
    background: #f8fafc;
}

.empty-state {
    padding: 60px 20px;

    text-align: center;

    color: #64748b;

    display: none;
}

@media(max-width:1150px) {

    .form-grid {
        grid-template-columns: 1fr 1fr;
    }

    .fetch-btn {
        width: 100%;
    }
}

@media(max-width:700px) {

    .container {
        width: calc(100% - 24px);

        padding-top: 24px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .results-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .download-btn {
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="badge">
            <span class="badge-dot"></span>
            Tool
        </div>

        <h1>
            Promotion Data Exporter
        </h1>

        <p class="subtitle">
            Retrieve promotion data by date range
            and export the results to CSV.
        </p>

    </header>


    <!-- SEARCH -->

    <div class="card form-card">

        <form id="searchForm">

            <div class="form-grid">

                <div class="field">

                    <label>
                        Access Code
                    </label>

                    <input
                        id="accessCode"
                        type="password"
                        placeholder="Enter access code"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Start Date
                    </label>

                    <input
                        id="startDate"
                        type="date"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        End Date
                    </label>

                    <input
                        id="endDate"
                        type="date"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Maximum Rows
                    </label>

                    <input
                        id="maximum"
                        type="number"
                        min="1"
                        value="10000"
                        required
                    >

                </div>


                <button
                    id="fetchButton"
                    class="fetch-btn"
                    type="submit"
                >
                    Fetch Promotions
                </button>

            </div>


            <div
                id="status"
                class="status"
            ></div>

        </form>

    </div>


    <!-- RESULTS -->

    <section id="results">

        <div class="card">

            <div class="results-header">

                <div>

                    <h2 class="results-title">
                        Promotion Results
                    </h2>

                    <p
                        id="resultsDescription"
                        class="results-description"
                    ></p>

                </div>


                <button
                    id="downloadButton"
                    class="download-btn"
                >
                    ↓ Download CSV
                </button>

            </div>


            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        Total Rows
                    </div>

                    <div
                        id="totalRows"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Date Range
                    </div>

                    <div
                        id="dateRange"
                        class="stat-value"
                    >
                        —
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Status
                    </div>

                    <div
                        id="dataStatus"
                        class="stat-value"
                    >
                        —
                    </div>

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr id="tableHead"></tr>
                    </thead>

                    <tbody
                        id="tableBody"
                    ></tbody>

                </table>


                <div
                    id="emptyState"
                    class="empty-state"
                >
                    No promotions found.
                </div>

            </div>

        </div>

    </section>

</div>


<script>

/* ============================================================
   API
============================================================ */

const API_URL =
    "https://www.gopher.bicarakan.id/limbo/intools/get-prom-list";


let promotionData = [];


/* ============================================================
   FIXED PROMOTION COLUMNS
============================================================ */

/*
    This is intentional.

    Instead of dynamically generating columns from the response,
    we define the exact fields returned by get-prom-list.

    This prevents the header from becoming one giant string.
*/

const COLUMNS = [

    {
        key: "id",
        label: "ID"
    },

    {
        key: "discount_percentage",
        label: "Discount %"
    },

    {
        key: "created_at",
        label: "Created At"
    },

    {
        key: "expired_at",
        label: "Expired At"
    },

    {
        key: "created_date",
        label: "Created Date"
    },

    {
        key: "modified_date",
        label: "Modified Date"
    },

    {
        key: "third_party_company_id",
        label: "Third Party Company ID"
    },

    {
        key: "code",
        label: "Code"
    },

    {
        key: "quota",
        label: "Quota"
    },

    {
        key: "description",
        label: "Description"
    },

    {
        key: "can_be_used_once",
        label: "Can Be Used Once"
    },

    {
        key: "flat_discount_amount",
        label: "Flat Discount Amount"
    },

    {
        key: "package_transaction_id",
        label: "Package Transaction ID"
    },

    {
        key: "for_third_party",
        label: "For Third Party"
    },

    {
        key: "promo_rule",
        label: "Promo Rule"
    },

    {
        key: "is_visible_automatically",
        label: "Visible Automatically"
    },

    {
        key: "psikoterapi_sesi_ke",
        label: "Psikoterapi Sesi Ke"
    },

    {
        key: "psikoterapi_sesi_id",
        label: "Psikoterapi Sesi ID"
    }

];


/* ============================================================
   DEFAULT DATES
============================================================ */

function formatDate(date) {

    return date
        .toISOString()
        .split("T")[0];

}


function setDefaultDates() {

    const today =
        new Date();


    const previousMonth =
        new Date(today);


    previousMonth.setMonth(
        previousMonth.getMonth() - 1
    );


    document.getElementById(
        "startDate"
    ).value =
        formatDate(
            previousMonth
        );


    document.getElementById(
        "endDate"
    ).value =
        formatDate(
            today
        );

}


setDefaultDates();


/* ============================================================
   STATUS
============================================================ */

function showStatus(
    message,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status " + type;

}


/* ============================================================
   VALUE CONVERSION
============================================================ */

function convertValue(
    key,
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    /*
        Go sql.NullString
    */

    if (
        typeof value === "object" &&
        value.Valid !== undefined
    ) {

        if (
            value.Valid === false
        ) {

            return "";

        }


        if (
            value.String !== undefined
        ) {

            return value.String ?? "";

        }


        if (
            value.Int32 !== undefined
        ) {

            return value.Int32 ?? "";

        }


        if (
            value.Int64 !== undefined
        ) {

            return value.Int64 ?? "";

        }


        if (
            value.Bool !== undefined
        ) {

            return value.Bool ?? "";

        }


        if (
            value.Time !== undefined
        ) {

            return value.Time ?? "";

        }

    }


    /*
        Date / timestamp objects
    */

    if (
        typeof value === "object" &&
        value.Time !== undefined
    ) {

        return value.Time;

    }


    /*
        Prevent [object Object]
    */

    if (
        typeof value === "object"
    ) {

        return JSON.stringify(
            value
        );

    }


    return value;

}


/* ============================================================
   NORMALIZE ROW
============================================================ */

function normalizeRow(
    item
) {

    const row = {};


    COLUMNS.forEach(
        column => {

            row[column.key] =
                convertValue(
                    column.key,
                    item[
                        column.key
                    ]
                );

        }
    );


    return row;

}


/* ============================================================
   RENDER HEADER
============================================================ */

function renderHeader() {

    const head =
        document.getElementById(
            "tableHead"
        );


    head.innerHTML = "";


    COLUMNS.forEach(
        column => {

            const th =
                document.createElement(
                    "th"
                );


            th.textContent =
                column.label;


            head.appendChild(
                th
            );

        }
    );

}


/* ============================================================
   RENDER TABLE
============================================================ */

function renderTable() {

    const body =
        document.getElementById(
            "tableBody"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    body.innerHTML = "";


    if (
        promotionData.length === 0
    ) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    promotionData.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            COLUMNS.forEach(
                column => {

                    const td =
                        document.createElement(
                            "td"
                        );


                    const value =
                        row[
                            column.key
                        ];


                    td.textContent =
                        value === null ||
                        value === undefined
                            ? ""
                            : String(value);


                    td.title =
                        td.textContent;


                    tr.appendChild(
                        td
                    );

                }
            );


            body.appendChild(
                tr
            );

        }
    );

}


/* ============================================================
   FETCH
============================================================ */

async function fetchPromotions(
    event
) {

    event.preventDefault();


    const accessCode =
        document
            .getElementById(
                "accessCode"
            )
            .value
            .trim();


    const startDate =
        document
            .getElementById(
                "startDate"
            )
            .value;


    const endDate =
        document
            .getElementById(
                "endDate"
            )
            .value;


    const maximum =
        Number(
            document
                .getElementById(
                    "maximum"
                )
                .value
        );


    if (!accessCode) {

        showStatus(
            "Please enter an access code.",
            "error"
        );

        return;

    }


    if (
        startDate > endDate
    ) {

        showStatus(
            "Start date cannot be after end date.",
            "error"
        );

        return;

    }


    if (
        !maximum ||
        maximum < 1
    ) {

        showStatus(
            "Maximum rows must be greater than 0.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "fetchButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Loading...";


    showStatus(
        "Fetching promotion data...",
        "info"
    );


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Accept":
                            "*/*",

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            access_code:
                                accessCode,

                            start_time:
                                startDate,

                            end_time:
                                endDate,

                            maximum:
                                maximum

                        })

                }
            );


        const json =
            await response.json();


        console.log(
            "API response:",
            json
        );


        if (!response.ok) {

            throw new Error(
                json.message ||
                json.error ||
                `HTTP ${response.status}`
            );

        }


        /*
            Expected:

            {
                data: {
                    ItemResult: [...]
                }
            }
        */

        if (
            !json.data ||
            !Array.isArray(
                json.data.ItemResult
            )
        ) {

            throw new Error(
                "Unexpected API response. data.ItemResult was not found."
            );

        }


        /*
            Normalize each API row
        */

        promotionData =
            json.data.ItemResult.map(
                normalizeRow
            );


        renderHeader();

        renderTable();


        /*
            Stats
        */

        document.getElementById(
            "totalRows"
        ).textContent =
            promotionData.length.toLocaleString();


        document.getElementById(
            "dateRange"
        ).textContent =
            `${startDate} → ${endDate}`;


        document.getElementById(
            "dataStatus"
        ).textContent =
            "Loaded";


        document.getElementById(
            "resultsDescription"
        ).textContent =
            `Showing ${promotionData.length.toLocaleString()} promotion records`;


        document.getElementById(
            "results"
        ).style.display =
            "block";


        if (
            promotionData.length > 0
        ) {

            showStatus(
                `Successfully loaded ${promotionData.length.toLocaleString()} promotion records.`,
                "success"
            );

        } else {

            showStatus(
                "No promotion records found.",
                "info"
            );

        }

    } catch(error) {

        console.error(
            error
        );


        showStatus(
            error.message ||
            "Failed to fetch promotion data.",
            "error"
        );

    } finally {

        button.disabled =
            false;


        button.textContent =
            "Fetch Promotions";

    }

}


/* ============================================================
   CSV ESCAPE
============================================================ */

function csvEscape(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    const text =
        String(value);


    if (
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n") ||
        text.includes("\r")
    ) {

        return (
            '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"'
        );

    }


    return text;

}


/* ============================================================
   DOWNLOAD CSV
============================================================ */

function downloadCSV() {

    if (
        promotionData.length === 0
    ) {

        showStatus(
            "There is no data to download.",
            "error"
        );

        return;

    }


    /*
        Header
    */

    const header =
        COLUMNS
            .map(
                column =>
                    csvEscape(
                        column.label
                    )
            )
            .join(",");


    /*
        Rows
    */

    const rows =
        promotionData.map(
            row => {

                return COLUMNS
                    .map(
                        column =>
                            csvEscape(
                                row[
                                    column.key
                                ]
                            )
                    )
                    .join(",");

            }
        );


    /*
        UTF-8 BOM
        Helps Excel display UTF-8 correctly.
    */

    const csv =
        "\uFEFF" +
        header +
        "\r\n" +
        rows.join(
            "\r\n"
        );


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    const endDate =
        document.getElementById(
            "endDate"
        ).value;


    link.href =
        url;


    link.download =
        `promotion-list-${startDate}-to-${endDate}.csv`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    showStatus(
        "CSV download started.",
        "success"
    );

}


/* ============================================================
   EVENTS
============================================================ */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        fetchPromotions
    );


document
    .getElementById(
        "downloadButton"
    )
    .addEventListener(
        "click",
        downloadCSV
    );

</script>

</body>
</html>
