<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Voucher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d8dc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #a5a5a5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 24px;
            padding: 14px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
        }

        .status.success {
            display: block;
            background: #ecfdf3;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .response-container {
            margin-top: 20px;
            display: none;
        }

        .response-container h3 {
            margin-bottom: 8px;
            font-size: 15px;
        }

        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Release Voucher</h1>
        <div class="subtitle">
            Release a counseling voucher for a session.
        </div>

        <form id="releaseVoucherForm">

            <div class="form-group">
                <label for="sessionId">Session ID</label>
                <input
                    type="text"
                    id="sessionId"
                    placeholder="Enter session ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <input
                    type="text"
                    id="accessCode"
                    placeholder="Enter access code"
                >
            </div>

            <div class="form-group">
                <label for="discountAmount">Discount Amount</label>
                <select id="discountAmount" required>
                    <option value="249000">249,000</option>
                    <option value="399000">399,000</option>
                </select>
            </div>

            <button type="submit" id="submitButton">
                Release Voucher
            </button>

        </form>

        <div id="status" class="status"></div>

        <div id="responseContainer" class="response-container">
            <h3>API Response</h3>
            <pre id="response"></pre>
        </div>

    </div>
</div>

<script>
    const form = document.getElementById("releaseVoucherForm");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const responseContainer = document.getElementById("responseContainer");
    const responseElement = document.getElementById("response");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const sessionId = document.getElementById("sessionId").value.trim();
        const accessCode = document.getElementById("accessCode").value.trim();
        const discountAmount = Number(
            document.getElementById("discountAmount").value
        );

        status.className = "status";
        status.textContent = "";
        responseContainer.style.display = "none";

        submitButton.disabled = true;
        submitButton.textContent = "Releasing...";

        try {
            const result = await fetch(
                "https://www.gopher.bicarakan.id/limbo/intools/release-voucher",
                {
                    method: "POST",
                    headers: {
                        "Accept": "*/*",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        discount_amount: discountAmount,
                        access_code: accessCode
                    })
                }
            );

            const contentType = result.headers.get("content-type") || "";

            let data;

            if (contentType.includes("application/json")) {
                data = await result.json();
            } else {
                data = await result.text();
            }

            responseContainer.style.display = "block";

            if (typeof data === "object") {
                responseElement.textContent =
                    JSON.stringify(data, null, 2);
            } else {
                responseElement.textContent = data;
            }

            if (!result.ok) {
                status.className = "status error";
                status.textContent =
                    `Request failed (${result.status} ${result.statusText})`;
            } else {
                status.className = "status success";
                status.textContent = "Voucher released successfully.";
            }

        } catch (error) {
            status.className = "status error";
            status.textContent =
                "Request failed:\n" + error.message;

            responseContainer.style.display = "none";

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Release Voucher";
        }
    });
</script>

</body>
</html>
