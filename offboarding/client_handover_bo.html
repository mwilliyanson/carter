<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin · Client Handover</title>

<style>
:root {
    --primary: #635bff;
    --primary-dark: #5148e5;
    --primary-soft: #efedff;

    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #788195;
    --border: #e4e7ee;

    --success: #159669;
    --success-bg: #e9f8f1;

    --warning: #c98400;
    --warning-bg: #fff6df;

    --danger: #d94d5c;
    --danger-bg: #fff0f2;

    --whatsapp: #25d366;

    --shadow: 0 8px 30px rgba(25,35,60,.06);
    --radius: 16px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
}

.page {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px 60px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -.6px;
}

.header p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.admin-badge {
    padding: 8px 13px;
    border-radius: 30px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 11px;
    font-weight: 750;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    padding: 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow);
}

.stat-number {
    font-size: 23px;
    font-weight: 800;
}

.stat-label {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.search-wrap {
    position: relative;
    flex: 1;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #9ba3b3;
}

.search {
    width: 100%;
    padding: 12px 13px 12px 36px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    font-size: 13px;
}

.search:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,91,255,.1);
}

.filter {
    width: 190px;
    padding: 11px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
}

/* =========================
   CLIENT LIST
========================= */

.client-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* =========================
   CLIENT CARD
========================= */

.client-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
}

.client-card.expanded {
    border-color: #d9d6ff;
}

/* =========================
   CLIENT HEADER
========================= */

.client-header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px;
    cursor: pointer;
}

.avatar {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
}

.client-main {
    flex: 1;
    min-width: 0;
}

.name {
    font-size: 14px;
    font-weight: 750;
}

.client-id {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
}

/* =========================
   STATUS
========================= */

.status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 7px;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 750;
}

.status.pending {
    background: var(--warning-bg);
    color: var(--warning);
}

.status.consent {
    background: var(--success-bg);
    color: var(--success);
}

.status.assigned {
    background: var(--primary-soft);
    color: var(--primary);
}

.status.complete {
    background: var(--success-bg);
    color: var(--success);
}

.status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
}

/* =========================
   CHEVRON
========================= */

.chevron {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: #f4f5f8;
    color: #747c8d;
    transition: transform .2s;
}

.expanded .chevron {
    transform: rotate(180deg);
    background: var(--primary-soft);
    color: var(--primary);
}

/* =========================
   CARD BODY
========================= */

.client-body {
    display: none;
    padding: 0 18px 19px;
    border-top: 1px solid var(--border);
}

.expanded .client-body {
    display: block;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    padding-top: 18px;
}

.full {
    grid-column: 1 / -1;
}

.label {
    display: block;
    margin-bottom: 7px;
    color: #5d6678;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .4px;
    text-transform: uppercase;
}

/* =========================
   PHONE
========================= */

.phone {
    width: 100%;
    padding: 11px 12px;
    background: #f5f6f8;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: #667083;
    outline: none;
    font-size: 13px;
    cursor: not-allowed;
}

/* =========================
   STEP
========================= */

.step {
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    background: #fff;
}

.step.locked {
    opacity: .55;
}

.step-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
}

.step-number {
    width: 27px;
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
}

.locked .step-number {
    background: #9da4b3;
}

.step-title {
    font-size: 13px;
    font-weight: 800;
}

.step-description {
    margin-top: 2px;
    color: var(--muted);
    font-size: 10px;
}

.step-body {
    padding: 16px;
}

/* =========================
   WHATSAPP
========================= */

.whatsapp-box {
    padding: 16px;
    background: #f5fbf8;
    border: 1px solid #d8eee5;
    border-radius: 11px;
}

.whatsapp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
}

.whatsapp-title {
    font-size: 13px;
    font-weight: 800;
}

.whatsapp-description {
    margin-bottom: 13px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
}

.whatsapp-button {
    width: 100%;
    padding: 12px 15px;
    border: none;
    border-radius: 9px;
    background: var(--whatsapp);
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 750;
}

.whatsapp-button:hover {
    filter: brightness(.96);
}

.whatsapp-button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.whatsapp-note {
    margin-top: 8px;
    color: #708579;
    font-size: 10px;
    text-align: center;
}

/* =========================
   CONSENT
========================= */

.checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 12px;
    margin-top: 10px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
}

.checkbox-row input {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    margin: 1px 0 0;
    accent-color: var(--primary);
    cursor: pointer;
}

.checkbox-content {
    flex: 1;
}

.checkbox-title {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
}

.checkbox-description {
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.45;
}

.checkbox-row.checked {
    border-color: #c8eadb;
    background: var(--success-bg);
}

/* =========================
   LOCK MESSAGE
========================= */

.lock-message {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #f5f6f8;
    color: #697284;
    font-size: 10px;
    font-weight: 650;
}

/* =========================
   SELECT
========================= */

.select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    outline: none;
    font-size: 13px;
}

.select:focus {
    border-color: var(--primary);
}

.select:disabled {
    background: #f3f4f7;
    cursor: not-allowed;
}

/* =========================
   ANNOTATION
========================= */

.annotation {
    width: 100%;
    min-height: 110px;
    padding: 12px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
}

.annotation:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,91,255,.08);
}

/* =========================
   DOCUMENTS
========================= */

.documents-box {
    padding: 16px;
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 11px;
}

.documents-title {
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 800;
}

.documents-description {
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
}

.upload {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 13px;
    border: 1px dashed #bcc3d0;
    border-radius: 9px;
    background: white;
    color: #596274;
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
}

.upload:hover {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
}

.file-input {
    display: none;
}

.files {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 7px;
    margin-top: 10px;
}

.file {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #f5f6f9;
    border-radius: 8px;
    font-size: 11px;
}

.file-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.remove {
    color: var(--danger);
    cursor: pointer;
    font-weight: 800;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    padding-top: 17px;
    border-top: 1px solid var(--border);
}

.action-right {
    display: flex;
    gap: 8px;
}

.reset,
.save,
.complete {
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 750;
}

.reset {
    border: 1px solid #e2e4e9;
    background: white;
    color: var(--danger);
}

.save {
    border: none;
    background: var(--primary);
    color: white;
}

.complete {
    border: none;
    background: var(--success);
    color: white;
}

.complete:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20,25,40,.55);
    backdrop-filter: blur(4px);
}

.modal {
    width: 100%;
    max-width: 450px;
    padding: 25px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 30px 90px rgba(0,0,0,.25);
}

.modal h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.modal p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.cancel {
    padding: 10px 15px;
    border: none;
    border-radius: 9px;
    background: #eef0f5;
    cursor: pointer;
}

.confirm {
    padding: 10px 15px;
    border: none;
    border-radius: 9px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    font-weight: 700;
}

.confirm.danger {
    background: var(--danger);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

    .page {
        padding: 20px 12px 40px;
    }

    .header h1 {
        font-size: 23px;
    }

    .admin-badge {
        display: none;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .toolbar {
        flex-direction: column;
    }

    .filter {
        width: 100%;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .status {
        display: none;
    }

    .actions {
        flex-direction: column;
        align-items: stretch;
    }

    .action-right {
        width: 100%;
    }

    .reset,
    .save,
    .complete {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="header">

        <div>
            <h1>Client Handover</h1>

            <p>
                Manage client consent and psychologist transitions.
            </p>
        </div>

        <div class="admin-badge">
            ADMIN VIEW
        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <div id="totalCount" class="stat-number">0</div>
            <div class="stat-label">Total clients</div>
        </div>

        <div class="stat">
            <div id="pendingCount" class="stat-number">0</div>
            <div class="stat-label">Awaiting consent</div>
        </div>

        <div class="stat">
            <div id="readyCount" class="stat-number">0</div>
            <div class="stat-label">In progress</div>
        </div>

        <div class="stat">
            <div id="completedCount" class="stat-number">0</div>
            <div class="stat-label">Completed</div>
        </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

        <div class="search-wrap">

            <span class="search-icon">🔍</span>

            <input
                id="search"
                class="search"
                placeholder="Search client name or phone number..."
            >

        </div>

        <select id="filter" class="filter">

            <option value="all">
                All clients
            </option>

            <option value="pending">
                Awaiting consent
            </option>

            <option value="progress">
                In progress
            </option>

            <option value="completed">
                Completed
            </option>

        </select>

    </div>


    <!-- CLIENT LIST -->

    <div id="clientList" class="client-list"></div>

</div>


<!-- MODAL -->

<div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

        <h2 id="modalTitle">
            Confirm
        </h2>

        <p id="modalText">
            Are you sure?
        </p>

        <div class="modal-actions">

            <button id="cancelButton" class="cancel">
                Cancel
            </button>

            <button id="confirmButton" class="confirm">
                Confirm
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   PSYCHOLOGISTS
========================================================= */

const psychologists = [
    "Dr. Amelia Putri",
    "Dr. Budi Santoso",
    "Dr. Clara Wijaya",
    "Dr. Dimas Pratama",
    "Dr. Nadia Sari"
];


/* =========================================================
   SAMPLE CLIENT DATA
========================================================= */

const clients = [

    {
        id: "CL-1024",
        name: "Andi Wijaya",
        phone: "6281234567890",
        lastSession: "11 Aug 2026",
        currentPsychologist: "Dr. Amelia Putri",

        consent: false,

        receivingPsychologist: "",
        psychologistNotified: false,

        annotation: "",
        files: [],

        completed: false,
        expanded: true
    },

    {
        id: "CL-1041",
        name: "Bunga Lestari",
        phone: "6281322114455",
        lastSession: "08 Aug 2026",
        currentPsychologist: "Dr. Budi Santoso",

        consent: true,

        receivingPsychologist: "",
        psychologistNotified: false,

        annotation: "",
        files: [],

        completed: false,
        expanded: false
    },

    {
        id: "CL-1098",
        name: "Catherine Lim",
        phone: "6281199887766",
        lastSession: "04 Aug 2026",
        currentPsychologist: "Dr. Clara Wijaya",

        consent: true,

        receivingPsychologist: "Dr. Dimas Pratama",
        psychologistNotified: false,

        annotation: "",
        files: [],

        completed: false,
        expanded: false
    }

];

let pendingAction = null;


/* =========================================================
   INITIALS
========================================================= */

function initials(name) {

    return name
        .split(" ")
        .slice(0, 2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

}


/* =========================================================
   STATUS
========================================================= */

function getStatus(client) {

    if (client.completed) {

        return {
            text: "Completed",
            class: "complete"
        };

    }

    if (
        client.consent &&
        client.receivingPsychologist &&
        client.psychologistNotified
    ) {

        return {
            text: "Ready to complete",
            class: "assigned"
        };

    }

    if (client.consent) {

        return {
            text: "Consent received",
            class: "consent"
        };

    }

    return {
        text: "Awaiting consent",
        class: "pending"
    };

}


function statusHTML(client) {

    const status = getStatus(client);

    return `
        <span class="status ${status.class}">
            <span class="status-dot"></span>
            ${status.text}
        </span>
    `;

}


/* =========================================================
   WHATSAPP — CONSENT
========================================================= */

function createConsentMessage(client) {

return `Halo ${client.name},

Kami ingin menginformasikan bahwa psikolog Anda sebelumnya sedang dalam proses menyelesaikan layanan di Bicarakan.id.

Untuk memastikan kesinambungan layanan Anda, kami ingin meminta persetujuan untuk mengalihkan informasi dan catatan konseling yang relevan kepada psikolog Bicarakan.id yang nantinya akan melanjutkan layanan Anda.

Apakah Anda bersedia memberikan persetujuan untuk proses tersebut?

Silakan balas:

SETUJU

atau

TIDAK SETUJU

Terima kasih.`;

}


/* =========================================================
   WHATSAPP — PSYCHOLOGIST
========================================================= */

function createPsychologistMessage(client) {

return `Halo ${client.name},

Kami ingin menginformasikan bahwa setelah proses koordinasi, psikolog yang direkomendasikan untuk melanjutkan layanan Anda adalah ${client.receivingPsychologist}.

Kami berharap proses ini dapat membantu memastikan kesinambungan layanan Anda.

Apabila Anda memiliki pertanyaan atau keberatan, silakan sampaikan kepada kami melalui WhatsApp ini.

Terima kasih.`;

}


/* =========================================================
   RENDER CLIENTS
========================================================= */

function renderClients() {

    const list =
        document.getElementById("clientList");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const filter =
        document
        .getElementById("filter")
        .value;

    list.innerHTML = "";


    const filtered = clients.filter(client => {

        const matchesSearch =
            client.name
            .toLowerCase()
            .includes(search)
            ||
            client.phone.includes(search);


        let matchesFilter = true;


        if (filter === "pending") {

            matchesFilter =
                !client.completed &&
                !client.consent;

        }


        if (filter === "progress") {

            matchesFilter =
                !client.completed &&
                client.consent;

        }


        if (filter === "completed") {

            matchesFilter =
                client.completed;

        }


        return matchesSearch && matchesFilter;

    });


    filtered.forEach(client => {

        const card =
            document.createElement("div");

        card.className =
            "client-card" +
            (
                client.expanded
                ? " expanded"
                : ""
            );


        const canAssign =
            client.consent;


        const canNotifyPsychologist =
            canAssign &&
            client.receivingPsychologist;


        const canComplete =
            client.consent &&
            client.receivingPsychologist &&
            client.psychologistNotified;


        card.innerHTML = `

            <!-- =========================
                 CLIENT HEADER
            ========================== -->

            <div
                class="client-header"
                data-id="${client.id}"
            >

                <div class="avatar">
                    ${initials(client.name)}
                </div>

                <div class="client-main">

                    <div class="name">

                        ${client.name}

                        ${statusHTML(client)}

                    </div>

                    <div class="client-id">
                        ${client.id}
                    </div>

                    <div class="meta">

                        <span>
                            📱 +${client.phone}
                        </span>

                        <span>
                            📅 Last session:
                            ${client.lastSession}
                        </span>

                        <span>
                            👤 ${client.currentPsychologist}
                        </span>

                    </div>

                </div>

                <div class="chevron">
                    ▼
                </div>

            </div>


            <!-- =========================
                 CARD BODY
            ========================== -->

            <div class="client-body">

                <div class="form-grid">


                    <!-- PHONE -->

                    <div>

                        <label class="label">
                            Client phone number
                        </label>

                        <input
                            class="phone"
                            value="+${client.phone}"
                            readonly
                            tabindex="-1"
                        >

                    </div>


                    <!-- CURRENT PSYCHOLOGIST -->

                    <div>

                        <label class="label">
                            Current psychologist
                        </label>

                        <input
                            class="phone"
                            value="${client.currentPsychologist}"
                            readonly
                            tabindex="-1"
                        >

                    </div>


                    <!-- ==================================
                         STEP 1 — CONSENT
                    =================================== -->

                    <div class="full">

                        <div class="step">

                            <div class="step-header">

                                <div class="step-number">
                                    1
                                </div>

                                <div>

                                    <div class="step-title">
                                        Client consent
                                    </div>

                                    <div class="step-description">
                                        First obtain the client's consent
                                        before assigning another psychologist.
                                    </div>

                                </div>

                            </div>


                            <div class="step-body">


                                <!-- WHATSAPP BUTTON FIRST -->

                                <div class="whatsapp-box">

                                    <div class="whatsapp-header">

                                        <div class="whatsapp-title">
                                            💬 Ask client for consent
                                        </div>

                                        ${
                                            client.consent
                                            ? `
                                                <span
                                                    style="
                                                    color:var(--success);
                                                    font-size:10px;
                                                    font-weight:800;
                                                    "
                                                >
                                                    ✓ Consent received
                                                </span>
                                            `
                                            : ""
                                        }

                                    </div>


                                    <div class="whatsapp-description">

                                        WhatsApp will open with a
                                        pre-filled consent request.
                                        The admin can edit the message
                                        before sending.

                                    </div>


                                    <button
                                        class="whatsapp-button consent-whatsapp"
                                        data-id="${client.id}"
                                    >

                                        💬
                                        ${
                                            client.consent
                                            ? "Open WhatsApp Again"
                                            : "Notify Client for Consent"
                                        }

                                    </button>


                                    <div class="whatsapp-note">

                                        Ask the client to reply directly
                                        through WhatsApp.

                                    </div>

                                </div>


                                <!-- ONLY CONSENT CHECKBOX -->

                                <label
                                    class="
                                    checkbox-row
                                    ${
                                        client.consent
                                        ? "checked"
                                        : ""
                                    }
                                    "
                                >

                                    <input
                                        type="checkbox"
                                        class="consent-checkbox"
                                        data-id="${client.id}"
                                        ${
                                            client.consent
                                            ? "checked"
                                            : ""
                                        }
                                    >

                                    <div class="checkbox-content">

                                        <div class="checkbox-title">
                                            Client consent received
                                        </div>

                                        <div class="checkbox-description">

                                            Client has explicitly confirmed
                                            that they agree to the transfer
                                            of relevant information to a
                                            future Bicarakan.id psychologist.

                                        </div>

                                    </div>

                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- ==================================
                         STEP 2 — PSYCHOLOGIST
                    =================================== -->

                    <div class="full">

                        <div
                            class="step ${
                                !canAssign
                                ? "locked"
                                : ""
                            }"
                        >

                            <div class="step-header">

                                <div class="step-number">
                                    2
                                </div>

                                <div>

                                    <div class="step-title">
                                        Psychologist assignment
                                    </div>

                                    <div class="step-description">
                                        Select and notify the psychologist
                                        who will continue the client's care.
                                    </div>

                                </div>

                            </div>


                            <div class="step-body">


                                ${
                                    !canAssign
                                    ? `
                                        <div class="lock-message">
                                            🔒
                                            This step is locked until
                                            client consent is received.
                                        </div>
                                    `
                                    : ""
                                }


                                <label class="label">
                                    Future psychologist
                                </label>


                                <select
                                    class="select psychologist"
                                    data-id="${client.id}"
                                    ${
                                        !canAssign
                                        ? "disabled"
                                        : ""
                                    }
                                >

                                    <option value="">
                                        Select psychologist...
                                    </option>

                                    ${
                                        psychologists
                                        .map(p => `

                                            <option
                                                value="${p}"
                                                ${
                                                    client.receivingPsychologist === p
                                                    ? "selected"
                                                    : ""
                                                }
                                            >
                                                ${p}
                                            </option>

                                        `)
                                        .join("")
                                    }

                                </select>


                                ${
                                    canAssign
                                    ? `

                                        <div style="margin-top:15px">

                                            <div class="whatsapp-box">

                                                <div class="whatsapp-header">

                                                    <div class="whatsapp-title">
                                                        💬 Notify client of psychologist
                                                    </div>

                                                    ${
                                                        client.psychologistNotified
                                                        ? `
                                                            <span
                                                                style="
                                                                color:var(--success);
                                                                font-size:10px;
                                                                font-weight:800;
                                                                "
                                                            >
                                                                ✓ Notified
                                                            </span>
                                                        `
                                                        : ""
                                                    }

                                                </div>


                                                <div class="whatsapp-description">

                                                    After selecting the
                                                    psychologist, notify
                                                    the client of who will
                                                    handle their future sessions.

                                                </div>


                                                <button
                                                    class="whatsapp-button psychologist-whatsapp"
                                                    data-id="${client.id}"
                                                    ${
                                                        !client.receivingPsychologist
                                                        ? "disabled"
                                                        : ""
                                                    }
                                                >

                                                    💬
                                                    ${
                                                        client.psychologistNotified
                                                        ? "Open WhatsApp Again"
                                                        : "Notify Client of Psychologist"
                                                    }

                                                </button>

                                            </div>


                                            <!-- PSYCHOLOGIST NOTIFICATION -->

                                            <label
                                                class="
                                                checkbox-row
                                                ${
                                                    client.psychologistNotified
                                                    ? "checked"
                                                    : ""
                                                }
                                                "
                                            >

                                                <input
                                                    type="checkbox"
                                                    class="psychologist-notified-checkbox"
                                                    data-id="${client.id}"
                                                    ${
                                                        client.psychologistNotified
                                                        ? "checked"
                                                        : ""
                                                    }
                                                >

                                                <div class="checkbox-content">

                                                    <div class="checkbox-title">
                                                        Client has been notified
                                                        of psychologist change
                                                    </div>

                                                    <div class="checkbox-description">

                                                        Client has been informed
                                                        that their future
                                                        psychologist will be

                                                        <strong>
                                                            ${
                                                                client.receivingPsychologist
                                                                || "—"
                                                            }
                                                        </strong>.

                                                    </div>

                                                </div>

                                            </label>

                                        </div>

                                    `
                                    : ""
                                }

                            </div>

                        </div>

                    </div>


                    <!-- ==================================
                         ANNOTATION
                    =================================== -->

                    <div class="full">

                        <label class="label">
                            Admin annotation
                        </label>

                        <textarea
                            class="annotation"
                            data-id="${client.id}"
                            placeholder="Add internal notes about the handover..."
                        >${client.annotation}</textarea>

                    </div>


                    <!-- ==================================
                         DOCUMENTS
                    =================================== -->

                    <div class="full">

                        <div class="documents-box">

                            <div class="documents-title">
                                📎 Handover documents
                            </div>

                            <div class="documents-description">

                                Attach relevant handover notes,
                                documents, images or PDF files
                                for the receiving psychologist.

                            </div>


                            <label class="upload">

                                📎 Attach documents

                                <input
                                    class="file-input"
                                    type="file"
                                    multiple
                                    accept="
                                        .pdf,
                                        .doc,
                                        .docx,
                                        .jpg,
                                        .jpeg,
                                        .png,
                                        .webp
                                    "
                                    data-id="${client.id}"
                                >

                            </label>


                            <div class="files">

                                ${
                                    client.files
                                    .map((file,index) => `

                                        <div class="file">

                                            📄

                                            <span class="file-name">
                                                ${file.name}
                                            </span>

                                            <span
                                                class="remove"
                                                data-id="${client.id}"
                                                data-index="${index}"
                                            >
                                                ×
                                            </span>

                                        </div>

                                    `)
                                    .join("")
                                }

                            </div>

                        </div>

                    </div>


                </div>


                <!-- =========================
                     ACTIONS
                ========================== -->

                <div class="actions">

                    <div>

                        ${
                            client.completed

                            ? `
                                <span
                                    style="
                                    color:var(--success);
                                    font-size:11px;
                                    font-weight:750;
                                    "
                                >
                                    ✓ Handover completed
                                </span>
                            `

                            : `

                                <span
                                    style="
                                    color:var(--muted);
                                    font-size:10px;
                                    "
                                >

                                    ${
                                        canComplete
                                        ? "Ready to complete"
                                        : "Complete the required steps above"
                                    }

                                </span>

                            `
                        }

                    </div>


                    <div class="action-right">

                        <button
                            class="reset"
                            data-id="${client.id}"
                        >
                            Reset
                        </button>

                        <button
                            class="save"
                            data-id="${client.id}"
                        >
                            Save
                        </button>

                        <button
                            class="complete"
                            data-id="${client.id}"
                            ${
                                !canComplete ||
                                client.completed
                                ? "disabled"
                                : ""
                            }
                        >
                            Complete Handover
                        </button>

                    </div>

                </div>

            </div>

        `;


        list.appendChild(card);

    });


    attachEvents();
    updateStats();

}


/* =========================================================
   EVENTS
========================================================= */

function attachEvents() {


    /* Expand card */

    document
    .querySelectorAll(".client-header")
    .forEach(header => {

        header.addEventListener("click", () => {

            const client =
                clients.find(
                    c => c.id === header.dataset.id
                );

            client.expanded =
                !client.expanded;

            renderClients();

        });

    });


    /* Annotation */

    document
    .querySelectorAll(".annotation")
    .forEach(input => {

        input.addEventListener("input", () => {

            const client =
                clients.find(
                    c => c.id === input.dataset.id
                );

            client.annotation =
                input.value;

        });

    });


    /* Consent */

    document
    .querySelectorAll(".consent-checkbox")
    .forEach(checkbox => {

        checkbox.addEventListener("change", () => {

            const client =
                clients.find(
                    c => c.id === checkbox.dataset.id
                );

            client.consent =
                checkbox.checked;


            /*
             * If consent is removed,
             * the entire second stage is reset.
             */

            if (!client.consent) {

                client.receivingPsychologist = "";

                client.psychologistNotified = false;

            }


            renderClients();

        });

    });


    /* Psychologist */

    document
    .querySelectorAll(".psychologist")
    .forEach(select => {

        select.addEventListener("change", () => {

            const client =
                clients.find(
                    c => c.id === select.dataset.id
                );

            client.receivingPsychologist =
                select.value;


            /*
             * If psychologist changes,
             * previous notification becomes invalid.
             */

            client.psychologistNotified =
                false;

            renderClients();

        });

    });


    /* Consent WhatsApp */

    document
    .querySelectorAll(".consent-whatsapp")
    .forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            const client =
                clients.find(
                    c => c.id === button.dataset.id
                );

            const message =
                createConsentMessage(client);

            const url =
                `https://wa.me/${client.phone}?text=${encodeURIComponent(message)}`;

            window.open(url, "_blank");

        });

    });


    /* Psychologist WhatsApp */

    document
    .querySelectorAll(".psychologist-whatsapp")
    .forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            const client =
                clients.find(
                    c => c.id === button.dataset.id
                );

            if (!client.receivingPsychologist) {

                openModal(
                    "Select psychologist",
                    "Please select the future psychologist first.",
                    false
                );

                return;

            }

            const message =
                createPsychologistMessage(client);

            const url =
                `https://wa.me/${client.phone}?text=${encodeURIComponent(message)}`;

            window.open(url, "_blank");

        });

    });


    /* Psychologist notified */

    document
    .querySelectorAll(".psychologist-notified-checkbox")
    .forEach(checkbox => {

        checkbox.addEventListener("change", () => {

            const client =
                clients.find(
                    c => c.id === checkbox.dataset.id
                );

            client.psychologistNotified =
                checkbox.checked;

            renderClients();

        });

    });


    /* Files */

    document
    .querySelectorAll(".file-input")
    .forEach(input => {

        input.addEventListener("change", () => {

            const client =
                clients.find(
                    c => c.id === input.dataset.id
                );

            [...input.files].forEach(file => {

                client.files.push(file);

            });

            renderClients();

        });

    });


    /* Remove files */

    document
    .querySelectorAll(".remove")
    .forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            const client =
                clients.find(
                    c => c.id === button.dataset.id
                );

            client.files.splice(
                Number(button.dataset.index),
                1
            );

            renderClients();

        });

    });


    /* Save */

    document
    .querySelectorAll(".save")
    .forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            openModal(
                "Saved",
                "The current handover information has been saved.",
                false
            );

        });

    });


    /* Reset */

    document
    .querySelectorAll(".reset")
    .forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            const client =
                clients.find(
                    c => c.id === button.dataset.id
                );

            pendingAction = {
                type: "reset",
                client
            };

            openModal(
                "Reset this handover?",
                `This will remove all information entered for ${client.name}, including consent status, psychologist assignment, annotations and attached documents.`,
                true
            );

        });

    });


    /* Complete */

    document
    .querySelectorAll(".complete")
    .forEach(button => {

        button.addEventListener("click", event => {

            event.stopPropagation();

            const client =
                clients.find(
                    c => c.id === button.dataset.id
                );

            pendingAction = {
                type: "complete",
                client
            };

            openModal(
                "Complete handover?",
                `Complete the handover for ${client.name} and assign ${client.receivingPsychologist} as the future psychologist?`,
                false
            );

        });

    });

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    document.getElementById("totalCount").innerText =
        clients.length;


    document.getElementById("pendingCount").innerText =

        clients.filter(c =>
            !c.completed &&
            !c.consent
        ).length;


    document.getElementById("readyCount").innerText =

        clients.filter(c =>
            !c.completed &&
            c.consent
        ).length;


    document.getElementById("completedCount").innerText =

        clients.filter(c =>
            c.completed
        ).length;

}


/* =========================================================
   MODAL
========================================================= */

function openModal(title, text, danger) {

    document.getElementById("modalTitle")
        .innerText = title;

    document.getElementById("modalText")
        .innerText = text;

    const confirm =
        document.getElementById("confirmButton");

    confirm.classList.toggle(
        "danger",
        !!danger
    );

    confirm.innerText =
        danger
        ? "Reset"
        : "OK";

    document.getElementById("modalBackdrop")
        .style.display = "flex";

}


function closeModal() {

    document.getElementById("modalBackdrop")
        .style.display = "none";

    pendingAction = null;

}


/* =========================================================
   MODAL CONFIRM
========================================================= */

document
.getElementById("confirmButton")
.addEventListener("click", () => {

    if (!pendingAction) {

        closeModal();

        return;

    }


    const {
        type,
        client
    } = pendingAction;


    /* RESET */

    if (type === "reset") {

        client.consent = false;

        client.receivingPsychologist = "";

        client.psychologistNotified = false;

        client.annotation = "";

        client.files = [];

        client.completed = false;

        closeModal();

        renderClients();

        return;

    }


    /* COMPLETE */

    if (type === "complete") {

        client.completed = true;

        closeModal();

        renderClients();

        return;

    }


    closeModal();

});


document
.getElementById("cancelButton")
.addEventListener(
    "click",
    closeModal
);


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById("search")
.addEventListener(
    "input",
    renderClients
);


document
.getElementById("filter")
.addEventListener(
    "change",
    renderClients
);


/* =========================================================
   INITIALIZE
========================================================= */

renderClients();

</script>

</body>
</html>
