<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Bidding</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: #333;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 24px;
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    input, button {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background: #1d4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    .flex {
      display: flex;
      gap: 10px;
    }

    .flex > div {
      flex: 1;
    }
  </style>
</head>
<body>

<header>
  <h2>Schedule Bidding System</h2>
</header>

<div class="container">

  <div class="card">
    <h3>Submit Bid</h3>
    <input type="text" id="name" placeholder="Your Name" />
    <input type="date" id="date" />
    <input type="text" id="time" placeholder="Preferred Time (e.g. 10:00 - 12:00)" />
    <button onclick="submitBid()">Submit Bid</button>
  </div>

  <div class="card">
    <h3>All Bids</h3>
    <button onclick="renderBids()">Refresh List</button>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody id="bidTable"></tbody>
    </table>
  </div>

</div>

<script>
  let bids = JSON.parse(localStorage.getItem('bids') || '[]');

  function submitBid() {
    const name = document.getElementById('name').value;
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;

    if (!name || !date || !time) {
      alert('Please fill all fields');
      return;
    }

    const bid = {
      name,
      date,
      time,
      createdAt: new Date().toLocaleString()
    };

    bids.push(bid);
    localStorage.setItem('bids', JSON.stringify(bids));

    document.getElementById('name').value = '';
    document.getElementById('date').value = '';
    document.getElementById('time').value = '';

    renderBids();
  }

  function renderBids() {
    const table = document.getElementById('bidTable');
    table.innerHTML = '';

    bids.forEach(bid => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${bid.name}</td>
        <td>${bid.date}</td>
        <td>${bid.time}</td>
        <td>${bid.createdAt}</td>
      `;
      table.appendChild(row);
    });
  }

  renderBids();
</script>

</body>
</html>
